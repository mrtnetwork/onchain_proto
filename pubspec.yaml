name: onchain_proto
description: Dart code generators for the OnChain ecosystem — Protocol Buffers (.proto), OpenAPI/OpenRPC JSON specs, Candid (.did), and Go structs — plus the proto compiler runtime used by on_chain, cosmos_sdk and zcash_dart builders.
version: 0.3.0
homepage: "https://github.com/mrtnetwork/onchain_proto"
repository: "https://github.com/mrtnetwork/onchain_proto"
Author: mrhaydari.t@gmail.com
