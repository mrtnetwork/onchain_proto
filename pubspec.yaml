environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  blockchain_utils:
    git:
      url: https://github.com/mrtnetwork/blockchain_utils

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
